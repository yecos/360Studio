name: Bootstrap OpenPlan3D Core

on:
  push:
    branches: [main]
    paths:
      - ".nexo/**"
      - ".github/workflows/bootstrap-openplan3d.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-space-ai-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[upstream-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXO repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch OpenPlan3D core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/laanlabs/openPlan3D.git "$RUNNER_TEMP/openplan3d"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.nexo' \
            --exclude='README.md' \
            "$RUNNER_TEMP/openplan3d/" ./

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply NEXO product layer
        run: node .nexo/apply-overlay.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Svelte project
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit synchronized core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexo-space-ai-bot"
          git config user.email "nexo-space-ai-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream or overlay changes to commit."
            exit 0
          fi
          UPSTREAM_SHA="$(git -C "$RUNNER_TEMP/openplan3d" rev-parse --short=12 HEAD)"
          git commit -m "chore: sync OpenPlan3D core ${UPSTREAM_SHA} [upstream-sync]"
          git push origin HEAD:main

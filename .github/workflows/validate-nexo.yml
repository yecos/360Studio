name: Validate NEXO SPACE AI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/validate-nexo.yml"
      - "tests/nexo-*.test.ts"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "svelte.config.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-nexo-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- --run tests/nexo-copilot-provider.test.ts
      - run: npm run check
      - run: npm run build
